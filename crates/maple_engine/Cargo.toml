[package]
name = "maple_engine"
description = "Engine implementation of maple engine"
license = "MIT"
version = "0.3.0"
edition = "2024"

[features]
serde = ["dep:serde", "glam/serde"]

[dependencies]
colored = "3.0.0"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
glam = { version = "0.33.2"  }
winit = "0.30.12"
log = "0.4"
rand = "0.10.2"
serde = {version = "1.0.229", optional = true, features = ["derive"]}
crossbeam-channel = "0.5.16"
rapidhash = "4.5.1"
rayon = "1.12.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
  web-time = "1.0"
