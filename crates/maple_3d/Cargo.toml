[package]
name = "maple_3d"
description = "Provides 3D rendering for the maple engine"
license = "MIT"
version = "0.3.0"
edition = "2024"

[features]
serde = ["dep:serde", "maple_engine/serde"]

[lints]
workspace = true

[dependencies]
gltf = { version = "1.4.1", features = ["KHR_materials_pbrSpecularGlossiness", "KHR_materials_unlit", "KHR_materials_emissive_strength"] }
glam = { version = "0.33.2"  }
log = "0.4"
bitflags = "2.13.0"
serde = {version = "1.0.229", optional = true, features = ["derive"]}

# maple
maple_app = {path = "../maple_app", version = "0.3.0"}
maple_renderer = {path = "../maple_renderer", version = "0.3.0"}
maple_engine = {path = "../maple_engine", version = "0.3.0"}
maple_derive  = {path = "../maple_derive", version = "0.3.0"}
chalk = "0.1.0"
bytemuck = "1.23.2"
parking_lot = "0.12.4"
rayon = "1.12.0"
image = { version = "0.25.6", features = ["hdr"] }
rand = "0.10.1"
crossbeam-channel = "0.5.16"
